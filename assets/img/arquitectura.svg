<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura del invernadero automatizado</title><desc id="desc">Los sensores envían lecturas al ESP32. El controlador se relaciona con los actuadores, la pantalla LCD y el teléfono mediante Bluetooth.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#64795a" stroke-width="1.6"/></marker></defs>
<rect width="900" height="600" fill="#e7ebdf"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" font-size="14" letter-spacing="2" fill="#536249">ORGANIZACIÓN DEL SISTEMA</text>
<g fill="none" stroke="#64795a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M274 239H337"/><path d="M563 239H626"/><path d="M450 325V390H290V423"/><path d="M450 390H610V423" marker-start="url(#arrow)"/></g>
<rect x="40" y="110" width="234" height="260" rx="12" fill="#f6f6ef"/><text x="64" y="155" font-size="24" fill="#20231e">Sensores</text><g font-size="19" fill="#626c57"><text x="64" y="203">DHT22</text><text x="64" y="242">Humedad de suelo</text><text x="64" y="281">BH1750</text><text x="64" y="320">MQ-135</text></g>
<rect x="337" y="154" width="226" height="171" rx="12" fill="#304d3b"/><g fill="#f6f6ef" text-anchor="middle"><text x="450" y="226" font-size="38">ESP32</text><text x="450" y="268" font-size="18">Lógica de control</text><text x="450" y="295" font-size="15">Automático / Manual</text></g>
<rect x="626" y="110" width="234" height="260" rx="12" fill="#f6f6ef"/><text x="650" y="155" font-size="24" fill="#20231e">Actuadores</text><g font-size="19" fill="#626c57"><text x="650" y="211">Bomba de agua</text><text x="650" y="256">Ventilador</text><text x="650" y="301">Luces LED</text><text x="650" y="344" font-size="14">Mediante módulo de relés</text></g>
<rect x="173" y="423" width="234" height="107" rx="11" fill="#d5deca"/><text x="290" y="468" text-anchor="middle" font-size="23" fill="#20231e">Pantalla LCD</text><text x="290" y="501" text-anchor="middle" font-size="16" fill="#526347">Información local</text>
<rect x="493" y="423" width="234" height="107" rx="11" fill="#d5deca"/><text x="610" y="468" text-anchor="middle" font-size="23" fill="#20231e">Teléfono</text><text x="610" y="501" text-anchor="middle" font-size="16" fill="#526347">Enlace Bluetooth</text>
<text x="450" y="575" text-anchor="middle" font-size="13" fill="#626c57">Esquema funcional · No representa conexiones eléctricas ni pines</text></g></svg>
